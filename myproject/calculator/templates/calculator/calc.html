<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calci by Pavan</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #e0e0e0;
    }
    .calculator {
      border: 2px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      background-color: #fff;
   }
    .calculator-screen {
      width: 100%;
      height: 50px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 10px;
      text-align: right;
      padding-right: 10px;
      font-size: 2rem;
      box-sizing: border-box;
    }
    .calculator-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
    }
    .calculator-keys button {
      height: 60px;
      font-size: 1.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #f9f9f9;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .calculator-keys button.operator {
      background-color: #f0ad4e;
      color: white;
   }
   .calculator-keys button.memory {
      background-color: #5bc0de;
      color: white;
   }
   .calculator-keys button:not(.operator):not(.memory):not(.all-clear):not(.equal-sign),
   .calculator-keys button.decimal {
      text-align: right;
      padding-right: 5px;
   }
   .calculator-keys button:hover {
      background-color: #ddd;
    }
    .calculator-keys button.equal-sign {
      background-color: #5cb85c;
      color: white;
      grid-column: span 2;
    }
   .calculator-keys button.all-clear {
      background-color: #6c757d;
      color: white;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" class="calculator-screen" value="0" disabled />
   <div class="calculator-keys">
      <button type="button" class="memory" value="mc">MC</button>
      <button type="button" class="memory" value="mr">MR</button>
      <button type="button" class="memory" value="m+">M+</button>
      <button type="button" class="memory" value="m-">M-</button>

      <button type="button" value="1">1</button>
      <button type="button" value="2">2</button>
      <button type="button" value="3">3</button>
      <button type="button" class="operator" value="+">+</button>

      <button type="button" value="4">4</button>
      <button type="button" value="5">5</button>
      <button type="button" value="6">6</button>
      <button type="button" class="operator" value="-">-</button>

      <button type="button" value="7">7</button>
      <button type="button" value="8">8</button>
      <button type="button" value="9">9</button>
      <button type="button" class="operator" value="*">&times;</button>
 
      <button type="button" value="0">0</button>
      <button type="button" class="decimal" value=".">.</button>
      <button type="button" class="all-clear" value="all-clear">C</button>
      <button type="button" class="operator" value="/">&divide;</button>
 
      <button type="button" class="equal-sign" value="=">=</button>
    </div>
  </div>

  <script>
    const calculator = {
      displayValue: '0',
      firstOperand: null,
      waitingForSecondOperand: false,
      operator: null,
      memoryValue: 0,
    };

   function updateDisplay() {
      const display = document.querySelector('.calculator-screen');
      display.value = calculator.displayValue;
    }
 
    updateDisplay();

    const keys = document.querySelector('.calculator-keys');
    keys.addEventListener('click', (event) => {
      const { target } = event;
      if (!target.matches('button')) return;

     if (target.classList.contains('memory')) {
        handleMemory(target.value);
        updateDisplay();
        return;
      }

     if (target.classList.contains('operator')) {
        handleOperator(target.value);
        updateDisplay();
        return;
      }

      if (target.classList.contains('decimal')) {
        inputDecimal(target.value);
        updateDisplay();
        return;
      }

      if (target.classList.contains('all-clear')) {
        resetCalculator();
        updateDisplay();
        return;
      }

      if (target.classList.contains('equal-sign')) {
        handleOperator('=');
        updateDisplay();
       return;
      }

      inputDigit(target.value);
      updateDisplay();
    });
 
    function inputDigit(digit) {
      const { displayValue, waitingForSecondOperand } = calculator;

      if (waitingForSecondOperand) {
        calculator.displayValue = digit;
        calculator.waitingForSecondOperand = false;
      } else {
        calculator.displayValue = displayValue === '0' ? digit : displayValue + digit;
      }
    }
 
    function inputDecimal(dot) {
      if (calculator.waitingForSecondOperand) return;
      if (!calculator.displayValue.includes(dot)) {
        calculator.displayValue += dot;
      }
   }

    function handleOperator(nextOperator) {
      const inputValue = parseFloat(calculator.displayValue);

      if (calculator.operator && calculator.waitingForSecondOperand) {
        calculator.operator = nextOperator !== '=' ? nextOperator : null;
        return;
      }

      if (calculator.firstOperand == null) {
        calculator.firstOperand = inputValue;
      } else if (calculator.operator) {
        const result = performCalculation[calculator.operator](calculator.firstOperand, inputValue);
        calculator.displayValue = String(result);
        calculator.firstOperand = result;
      }

      calculator.waitingForSecondOperand = nextOperator !== '=';
      calculator.operator = nextOperator !== '=' ? nextOperator : null;
    }
 
    const performCalculation = {
      '/': (firstOperand, secondOperand) => firstOperand / secondOperand,
      '*': (firstOperand, secondOperand) => firstOperand * secondOperand,
      '+': (firstOperand, secondOperand) => firstOperand + secondOperand,
      '-': (firstOperand, secondOperand) => firstOperand - secondOperand,
    };

    function handleMemory(memoryOperator) {
      const inputValue = parseFloat(calculator.displayValue);

      switch (memoryOperator) {
        case 'mc': // Memory Clear
          calculator.memoryValue = 0;
          break;
        case 'mr': // Memory Recall
          calculator.displayValue = String(calculator.memoryValue);
          break;
        case 'm+': // Memory Add
          calculator.memoryValue += inputValue;
          calculator.waitingForSecondOperand = true;
          break;
        case 'm-': // Memory Subtract
          calculator.memoryValue -= inputValue;
          calculator.waitingForSecondOperand = true;
          break;
      }
    }

   function resetCalculator() {
      calculator.displayValue = '0';
      calculator.firstOperand = null;
      calculator.waitingForSecondOperand = false;
      calculator.operator = null;
    }

    // Keyboard support
    document.addEventListener('keydown', (event) => {
      const { key } = event;

      if (/\d/.test(key)) {
        inputDigit(key);
        updateDisplay();
      } else if (key === '.') {
        inputDecimal(key);
        updateDisplay();
      } else if (['+', '-', '*', '/'].includes(key)) {
        handleOperator(key);
        updateDisplay();
      } else if (key === 'Enter' || key === '=') {
        handleOperator('=');
        updateDisplay();
      } else if (key === 'Escape' || key.toLowerCase() === 'c') {
        resetCalculator();
        updateDisplay();
      }
    });
 </script>
</body>
</html>
